name: opencode-comment

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode-comment:
    if: |
      github.event.comment != null &&
      github.event.comment.user.login == 'bgzo' &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    # 安装 + 一次会话的上限：provider 卡死或编码死循环时不会占满默认的 6 小时
    timeout-minutes: 20
    # 只读 contents：即使工作区变脏或 agent 被注入，opencode 也无法 push
    permissions:
      contents: read
      # 评论需要写权限
      pull-requests: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      MODEL: opencode-go/glm-5.3-flash
      # 用 workflow 的 GITHUB_TOKEN（contents: read），不再用 OpenCode App token：
      # App token 有写权限，能绕开 bash deny 规则直接 commit/push
      USE_GITHUB_TOKEN: "true"
      # 版本查询三连失败时的固定回退版本，保证任何路径下安装版本可复现
      OPENCODE_FALLBACK_VERSION: "1.18.33"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      # deny 规则与只读 agent（default_agent=ci-readonly）和 review workflow 共用同一
      # 脚本。只读原因：handler 在 chat 之后会对任何变脏的工作区执行 commit/push，而
      # 只读 token 推不上去，push 失败会用 git 报错顶掉真正的回答；因此这一侧必须只读，
      # 需要改代码时由 agent 在回复里给出 diff。
      - name: Configure opencode CI permissions (read-only agent, deny rm / git commit / git push)
        run: bash .github/scripts/configure-opencode-permissions.sh
      # 版本取自 npm 的 opencode-ai（v1 线）；GitHub 的 latest release 可能是
      # OpenCode 2，装不上 v1 的平台包。
      - name: Get opencode version (npm v1 channel, non-fatal)
        id: version
        run: |
          VERSION=""
          for attempt in 1 2 3; do
            if VERSION=$(curl -fsSL --max-time 20 https://registry.npmjs.org/opencode-ai/latest 2>/dev/null | jq -r '.version // empty') \
               && [ -n "${VERSION}" ]; then
              break
            fi

            VERSION=""
            if [ "${attempt}" -lt 3 ]; then
              echo "opencode version lookup attempt ${attempt} failed; retrying" >&2
              sleep 2
            fi
          done
          if [ -z "${VERSION}" ]; then
            VERSION="${OPENCODE_FALLBACK_VERSION}"
            echo "::warning::Could not resolve the opencode release tag; falling back to ${VERSION}."
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Install opencode
        # 安装必须有时限：下载挂起会吃掉整个 job 的 20 分钟
        timeout-minutes: 8
        env:
          PINNED_VERSION: ${{ steps.version.outputs.version }}
        # 版本固定；脚本内部按该版本的 npm sha512 校验安装包，并重试临时 5xx。
        # 不缓存 ~/.opencode/bin：缓存命中会绕过校验。
        run: bash .github/scripts/install_opencode.sh "${PINNED_VERSION}"
      - name: Add opencode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Run opencode
        run: opencode github run
