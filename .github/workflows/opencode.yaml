name: opencode

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (github.event.comment != null &&
       github.event.comment.user.login == 'bgzo' &&
       (contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')))
      ||
      (github.event.pull_request != null &&
       github.event.pull_request.user.login == 'bgzo')
    runs-on: ubuntu-latest
    # macos-14
    # windows-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure opencode CI permissions (deny rm)
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "permission": {
              "bash": {
                "rm *": "deny",
                "rmdir *": "deny",
                "shred *": "deny",
                "truncate *": "deny"
              }
            }
          }
          EOF
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.2
          use_github_token: true
          prompt: |
            你正在 GitHub Actions 中执行一次性只读代码审查。你可以运行除 commit 和 push 外的一切操作辅助判断，并需要保持如下审查规范：

            1. 报告所有发现的问题，包括不限于确凿问题、潜在风险和优化建议（潜在问题需注明"潜在风险"并说明触发条件）；
            2. 每条意见必须给出：文件路径 + 行号、问题是什么、为什么以及具体修复建议。无法定位到具体行号的要说明大致位置；
            3.问题、意见可以按类型、严重程度归类，分级（严重/一般/建议）；
            4. 所有意见、问题，一次性全部提出，禁止分多次、多轮补充，有多少报多少，不设上限，不要筛选。
            5. 若确实没有问题，回复「LGTM」并结束。
            6. 回复语言使用中文。
